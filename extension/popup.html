<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ytdl</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="brand">ytdl</div>
      <p id="page-title" class="page-title">Loading…</p>
    </header>

    <section id="status-block" class="status" hidden></section>

    <form id="root-form">
      <label class="field-label" for="root">Download folder</label>
      <div class="root-controls">
        <input id="root" type="text" placeholder="/Volumes/SSD/Music" required
          autocomplete="off" spellcheck="false" aria-describedby="root-hint" />
        <button id="save-root" type="submit">Save</button>
      </div>
      <p id="root-hint" class="hint">Enter an absolute folder path. Saved on this browser.</p>
    </form>

    <section id="main" hidden>
      <label class="field-label" for="filter">Folder</label>
      <input
        id="filter"
        type="search"
        placeholder="Filter folders…"
        autocomplete="off"
        spellcheck="false"
      />

      <div id="folders" class="folders" role="listbox" aria-label="Music folders"></div>

      <button id="download" type="button" disabled>Download</button>
      <button id="cancel" type="button" hidden>Cancel download</button>
      <p id="hint" class="hint">Downloads continue when you close this popup.</p>
    </section>

    <pre id="log" class="log" hidden></pre>

    <script src="urls.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
